<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Neon Accents -->
    <linearGradient id="yt-red-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF0000" />
      <stop offset="50%" stop-color="#FF3366" />
      <stop offset="100%" stop-color="#FF6B00" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF0000" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FF0000" stop-opacity="0" />
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Pattern Grid -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.6" />
    </pattern>

    <style>
      .pulse-circle {
        animation: pulse 3s infinite ease-in-out;
      }
      .dash-flow {
        stroke-dasharray: 8, 8;
        animation: flow 20s linear infinite;
      }
      .chart-line {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: drawLine 3.5s ease-out forwards;
      }
      .float-pill {
        animation: float 4s ease-in-out infinite alternate;
      }
      .float-pill-reverse {
        animation: floatRev 4.5s ease-in-out infinite alternate;
      }
      @keyframes flow {
        from { stroke-dashoffset: 0; }
        to { stroke-dashoffset: 320; }
      }
      @keyframes drawLine {
        to { stroke-dashoffset: 0; }
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.4; }
        50% { transform: scale(1.15); opacity: 0.8; }
      }
      @keyframes float {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes floatRev {
        0% { transform: translateY(0px); }
        100% { transform: translateY(8px); }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)" />
  <rect width="1200" height="360" rx="16" fill="url(#grid-pattern)" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="140" fill="#FF0000" opacity="0.12" filter="url(#glow)" />
  <circle cx="1050" cy="280" r="160" fill="#6366F1" opacity="0.15" filter="url(#glow)" />
  <circle cx="920" cy="90" r="90" fill="#38BDF8" opacity="0.12" filter="url(#glow)" />

  <!-- Dynamic Background Analytics Waves & Growth Curve -->
  <g opacity="0.45">
    <!-- Area Fill Under Graph -->
    <path d="M 50 310 Q 300 280, 500 230 T 850 160 T 1150 100 L 1150 330 L 50 330 Z" fill="url(#glow-grad)" />

    <!-- Trend Lines -->
    <path class="dash-flow" d="M 50 310 Q 300 280, 500 230 T 850 160 T 1150 100" fill="none" stroke="#FF3366" stroke-width="2.5" opacity="0.6" />
    <path class="chart-line" d="M 50 310 Q 300 280, 500 230 T 850 160 T 1150 100" fill="none" stroke="url(#yt-red-grad)" stroke-width="4.5" filter="url(#soft-glow)" />

    <!-- Secondary Cyan Signal Line -->
    <path class="dash-flow" d="M 80 320 Q 350 300, 600 270 T 950 200 T 1150 150" fill="none" stroke="#38BDF8" stroke-width="1.8" opacity="0.5" />
  </g>

  <!-- Background Dynamic Metric Nodes / Pulsing Targets -->
  <g opacity="0.85">
    <!-- Node 1 -->
    <circle cx="500" cy="230" r="10" fill="#FF0000" opacity="0.3" class="pulse-circle" style="transform-origin: 500px 230px;" />
    <circle cx="500" cy="230" r="4.5" fill="#FFFFFF" />
    <!-- Node 2 -->
    <circle cx="850" cy="160" r="12" fill="#FF3366" opacity="0.3" class="pulse-circle" style="transform-origin: 850px 160px;" />
    <circle cx="850" cy="160" r="5" fill="#FFFFFF" />
    <!-- Node 3 -->
    <circle cx="1150" cy="100" r="14" fill="#38BDF8" opacity="0.3" class="pulse-circle" style="transform-origin: 1150px 100px;" />
    <circle cx="1150" cy="100" r="5.5" fill="#38BDF8" />
  </g>

  <!-- Floating Metric Chips / Status Badges (Placed unobtrusively in top corners) -->
  <g class="float-pill" transform="translate(930, 32)">
    <rect width="210" height="42" rx="21" fill="#1E293B" stroke="#334155" stroke-width="1.2" opacity="0.9" />
    <circle cx="24" cy="21" r="7" fill="#10B981" />
    <text x="40" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">SERP Rank #1 · High CTR</text>
  </g>

  <g class="float-pill-reverse" transform="translate(680, 24)">
    <rect width="215" height="42" rx="21" fill="#1E293B" stroke="#475569" stroke-width="1.2" opacity="0.9" />
    <circle cx="24" cy="21" r="7" fill="#FF0000" />
    <text x="40" y="26" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600">Keyword Volume +250%</text>
  </g>

  <!-- High-Contrast Foreground Content (Title, Subtitle, Tags) -->
  <g id="foreground-content" transform="translate(70, 75)">
    <!-- YouTube Play Icon Badge -->
    <g transform="translate(0, 8)">
      <rect width="64" height="46" rx="12" fill="url(#yt-red-grad)" filter="url(#soft-glow)" />
      <polygon points="26,16 44,23 26,30" fill="#FFFFFF" />
    </g>

    <!-- Category Pill -->
    <g transform="translate(80, 10)">
      <rect width="180" height="28" rx="14" fill="#FF0000" fill-opacity="0.15" stroke="#FF0000" stroke-width="1" />
      <text x="90" y="19" fill="#FF4D6D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">CREATOR SEO ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="105" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="900" letter-spacing="-1">
      Awesome YouTube SEO &amp; Optimization
    </text>

    <!-- Subtitle -->
    <text x="0" y="146" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="500">
      Curated directory of SaaS intelligence platforms, open-source toolkits &amp; algorithm growth automation
    </text>

    <!-- Capability Tags in Foreground Bottom -->
    <g transform="translate(0, 178)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="160" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="80" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔍 Keyword Research</text>

      <!-- Tag 2 -->
      <rect x="172" y="0" width="170" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="257" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🏷️ Metadata &amp; Tags</text>

      <!-- Tag 3 -->
      <rect x="354" y="0" width="180" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="444" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📈 Ranking &amp; Analytics</text>

      <!-- Tag 4 -->
      <rect x="546" y="0" width="165" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="628" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🤖 AI &amp; LLM Automation</text>

      <!-- Tag 5 -->
      <rect x="723" y="0" width="150" height="32" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="798" y="21" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">⚡ Self-Hosted OSS</text>
    </g>
  </g>

  <!-- Sleek Border Accent -->
  <rect width="1200" height="360" rx="16" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6" />
</svg>
